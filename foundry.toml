[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "forge-std/=lib/openzeppelin-contracts/lib/forge-std/src/",
    "solady/=lib/solady/src/",
]

solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

# Allow FFI for OpenZeppelin Upgrades
ffi = true
ast = true
build_info = true
extra_output = ["storageLayout"]

[fuzz]
runs = 1000
seed = "0x1"

[invariant]
runs = 256
depth = 50
fail_on_revert = false

[rpc_endpoints]
baseSepolia = "${BASE_SEPOLIA_RPC_URL}"
baseMainnet = "${BASE_MAINNET_RPC_URL}"

[etherscan]
baseSepolia = { key = "${BASESCAN_API_KEY}", url = "https://api-sepolia.basescan.org/api" }
baseMainnet = { key = "${BASESCAN_API_KEY}", url = "https://api.basescan.org/api" }
