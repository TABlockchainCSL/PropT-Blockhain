[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "forge-std/=lib/openzeppelin-contracts/lib/forge-std/src/",
]

solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

# Allow FFI for OpenZeppelin Upgrades
ffi = true
ast = true
build_info = true
extra_output = ["storageLayout"]

[rpc_endpoints]
baseSepolia = "${BASE_SEPOLIA_RPC_URL}"
baseMainnet = "${BASE_MAINNET_RPC_URL}"

[etherscan]
baseSepolia = { key = "${BASESCAN_API_KEY}", url = "https://api-sepolia.basescan.org/api" }
baseMainnet = { key = "${BASESCAN_API_KEY}", url = "https://api.basescan.org/api" }
